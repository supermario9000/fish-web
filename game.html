<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Turntles</title>
    <link rel="icon" href="assets/Simple pngs/mini_turt.png" type="image/x-icon">
    <link rel="stylesheet" href="game.css">
</head>
<body>
	<div class="game_main">
        <!-- Username Entry Modal -->
        <div id="username-entry-modal" class="modal">
            <div class="modal-content">
                <h2>Enter Your Username</h2>
                <p>Your scores will be automatically saved to the leaderboard</p>
                <form id="username-entry-form">
                    <input type="text" id="username-entry-input" name="username" required placeholder="Enter username (min 4 letters)">
                    <div id="username-entry-error" style="color: red; font-size: 14px; margin-top: 5px; display: none; min-height: 20px;"></div>
                    <button type="submit" id="username-entry-button" class="modal-button" disabled>Continue</button>
                </form>
            </div>
        </div>

        <div class="stat_bar">
            <div class="counter">Time: <span id="timer-value">0</span>s</div>
            <div class="counter">Score: <span id="score-value">0</span></div>
            <div class="counter">Mistake count: <span id="mistake-count">0</span></div>
        </div>
        <div class="actions">
            <button onclick="startGame()" class="start_button"></button>
            <button onclick="restart()" class="restart_button"></button>
            <a href="index.html" class="end_button"></a>
        </div>
        
        <div id="level-easy" class="level-container hidden">
            <div id="start-screen" class="start-screen">
                <button onclick="startGame()" class="start-screen-button"></button>
            </div>
        </div>
        <div id="level-medium" class="level-container hidden">
            <div id="start-screen" class="start-screen">
                <button onclick="startGame()" class="start-screen-button"></button>
            </div>
        </div>
        <div id="level-hard" class="level-container hidden">
            <div id="start-screen" class="start-screen">
                <button onclick="startGame()" class="start-screen-button"></button>
            </div>
        </div>
    </div>

    <div id="completion-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Level Complete!</h2>
            <p>Player: <span id="modal-player" style="font-weight: bold; color: #4caf50;"></span></p>
            <p>Time: <span id="modal-time">0</span>s</p>
            <p>Score: <span id="modal-score">0</span></p>
            <p>Mistakes: <span id="modal-mistakes">0</span></p>
            <p style="color: green; font-size: 14px; margin-top: 15px;">✓ Score automatically saved to leaderboard</p>
            <div style="display: flex; gap: 10px; margin-top: 20px; flex-direction: column;">
                <button type="button" class="modal-button green-button" onclick="nextLevel()">Next Level</button>
                <a href="index.html" class="modal-button modal-link">Return Home</a>
            </div>
        </div>
    </div>

    <!-- Scoreboard Modal -->
    <div id="scoreboard-modal" class="modal hidden">
        <div class="modal-content scoreboard-content">
            <h2>Leaderboard - <span id="scoreboard-level">Easy</span></h2>
            <table class="scoreboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Time (s)</th>
                        <th>Score</th>
                        <th>Mistakes</th>
                    </tr>
                </thead>
                <tbody id="scoreboard-body">
                </tbody>
            </table>
            <div class="scoreboard-actions">
                <button class="modal-button" onclick="playAgain()">Play Again</button>
                <button class="modal-button green-button" onclick="nextLevel()">Next Level</button>
                <a href="index.html" class="modal-button modal-link">Home</a>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>

</html>

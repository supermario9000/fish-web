<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Turntles</title>
    <link rel="icon" href="assets/Simple pngs/mini_turt.png" type="image/x-icon">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="main">
        <img src="assets/Simple pngs/Game title.png" class="title_img" alt="Game Title"/>
        <img src="assets/Simple pngs/vezliukas.png" class="big_turtle_img" alt="Turtle big"/>

        <button class="leaderboard-btn" onclick="showLeaderboard()">🏆 Leaderboard</button>

        <div class="level_container">
            <div class="level_img_container">
                <img src="assets/Simple pngs/Level1.png" class="container_img_1" alt="Level 1"/>
                <a href="game.html?level=easy" class="start_button"></a>
            </div>
            <div class="level_img_container">
                <img src="assets/Simple pngs/Level2.png" class="container_img_1" alt="Level 2"/>
                <a href="game.html?level=medium" class="start_button"></a>
            </div>
            <div class="level_img_container">
                <img src="assets/Simple pngs/Level3.png" class="container_img_1" alt="Level 3"/>
                <a href="game.html?level=hard" class="start_button"></a>
            </div>
        </div>

    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-content leaderboard-modal-content">
            <h2>Leaderboards</h2>
            <div class="leaderboard-tabs">
                <button class="tab-btn active" onclick="switchLeaderboardLevel('easy')">Easy</button>
                <button class="tab-btn" onclick="switchLeaderboardLevel('medium')">Medium</button>
                <button class="tab-btn" onclick="switchLeaderboardLevel('hard')">Hard</button>
            </div>
            <table class="scoreboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Time (s)</th>
                        <th>Moves</th>
                        <th>Mistakes</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                </tbody>
            </table>
            <button class="modal-button" onclick="closeLeaderboard()">Close</button>
        </div>
    </div>
    <script src="index.js"></script>
